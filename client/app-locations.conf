# Shared by the :80 and :443 server blocks in nginx.conf.

# The game socket, on the same origin as the page: no CORS, one public port,
# and it becomes wss:// automatically when the page is served over TLS.
location /ws {
  set $game_server server;
  proxy_pass http://$game_server:8787;

  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The server pings every 30s; nginx's default 60s read timeout would drop a
  # quiet socket on a slow link. Hold idle connections for an hour.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_buffering off;
}

location = /health {
  set $health_server server;
  proxy_pass http://$health_server:8787;
  proxy_set_header Host $host;
}

# Vite emits content-hashed filenames, so these can be cached hard.
location /assets/ {
  expires 1y;
  add_header Cache-Control "public, immutable";
}

# Single-page app: unknown paths render the app shell, not a 404.
location / {
  try_files $uri $uri/ /index.html;
}
