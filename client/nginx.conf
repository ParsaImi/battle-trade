# Only send the Connection: upgrade header for actual upgrade requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving the upstream through a variable makes
  # nginx re-resolve at request time, so a restarted server container with a
  # new IP is picked up instead of 502-ing until nginx is reloaded.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  include /etc/nginx/app-locations.conf;
}

# HTTPS. This is not just polish: some networks (Iranian ISPs among them) pass
# the WebSocket handshake and then kill the plaintext frames, so the socket
# upgrades and immediately goes silent. Under TLS the frames are opaque and the
# connection survives. The client follows the page protocol, so serving the page
# here switches it to wss:// with no code change.
#
# The certificate is whatever is in /etc/nginx/certs; the entrypoint generates a
# self-signed one if none is mounted.
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  include /etc/nginx/app-locations.conf;
}
