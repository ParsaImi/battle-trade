# Only send the Connection: upgrade header for actual upgrade requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  # Let's Encrypt HTTP-01 challenge. `^~` so it still wins when everything else
  # on :80 is being redirected to HTTPS — otherwise renewal breaks.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # Written by the entrypoint: either the app, or a redirect to HTTPS.
  # Plain HTTP is a dead end on networks that filter WebSocket frames, so once
  # a trusted certificate is in place everyone should be sent to :443.
  include /etc/nginx/http-mode.conf;
}

# HTTPS. Not just polish: some networks (Iranian ISPs among them) let the
# WebSocket handshake through and then drop the plaintext frames, so the socket
# upgrades and instantly goes silent. Under TLS the frames are opaque and the
# connection survives. The client follows the page protocol, so serving here
# switches it to wss:// with no code change.
server {
  listen 443 ssl;
  http2 on;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;

  include /etc/nginx/app-locations.conf;
}
